name: brokers-core
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -e brokers-core pytest
      - run: python -m pytest brokers-core/tests/unit/
      - run: python -m pytest brokers-core/tests/architecture/
      - run: |
          if grep -rE '(^|[^a-zA-Z_])(from inc_trade|import inc_trade)' brokers-core/src/ --include='*.py'; then
            echo "ERROR: brokers-core must not import inc_trade"
            exit 1
          fi
          echo "Clean — no inc_trade imports"
