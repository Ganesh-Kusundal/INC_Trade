[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradex"
version = "0.1.0"
description = "Broker-agnostic trading SDK"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.optional-dependencies]
development = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
