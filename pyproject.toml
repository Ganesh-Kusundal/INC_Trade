# pyproject.toml — INC_Trade project configuration
# ruff (lint + format), black, mypy

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
]
ignore = [
    "E501", # line-too-long — handled by formatter
]

# Per-file rule ignores for deliberate code styles:
#   - idempotency.py: compact try/except and stats lines (E701, E702)
#   - test_idempotency.py: compact thread loop style (E701)
#   - market_feed_pb2.py: generated protobuf stub with re-exports (F401)
[tool.ruff.lint.per-file-ignores]
"brokers/common/idempotency.py" = ["E701", "E702"]
"brokers/tests/common/test_idempotency.py" = ["E701"]
"brokers/upstox/streaming/proto/market_feed_pb2.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
