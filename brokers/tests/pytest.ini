[pytest]
markers =
    architecture: enforce hexagonal boundary rules and invariants (<1s)
    integration: live or integration tests requiring broker credentials
    upstox: Upstox broker integration tests
    dhan: Dhan broker integration tests
    sandbox: sandbox environment tests
    performance: latency and performance benchmarks
    regression: regression suite tests
    off_market_safe: safe to run outside market hours
    market_hours: requires NSE market hours (or FORCE_MARKET_OPEN=1)
